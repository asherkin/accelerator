name: Build extension
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      cc:
        type: string
        required: true
      cxx:
        type: string
      sourcemod-branch:
        type: string
        required: true
      upload:
        type: boolean
        required: false
        default: false
      upload-artifact-name:
        type: string
        required: false
        default: package
      debug:
        type: boolean
        required: false
        default: false
      container:
        type: string
        required: false

jobs:
  build:
    name: ${{ inputs.os }}-${{ inputs.cc }}
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: SourceMod checkout
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ inputs.sourcemod-branch }}
          submodules: recursive
          path: sourcemod
          fetch-depth: 1

      - name: Resolve SourceMod path
        shell: bash
        run: echo "SOURCEMOD=$GITHUB_WORKSPACE/sourcemod" >> $GITHUB_ENV

      - name: Linux dependencies
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev \
            zlib1g-dev:i386 zlib1g-dev

      - name: Select compiler
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          echo "CC=${{ inputs.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ inputs.cxx }}" >> $GITHUB_ENV
          ${{ inputs.cc }} --version
          ${{ inputs.cxx }} --version

      - name: Install AMBuild
        shell: bash
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Build
        shell: bash
        run: |
          mkdir -p build && cd build
          python3 ../configure.py ${{ inputs.debug && '--enable-debug' || '--enable-optimize' }}
          ambuild

      - name: Upload package
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: build/package
